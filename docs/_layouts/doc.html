---
layout: default
---
<header class="page-header">
  <p class="eyebrow">{{ page.parent | default: "Documentation" }}</p>
  <h1 class="page-title">{{ page.title | escape }}</h1>
  {% if page.subtitle %}<p class="page-subtitle">{{ page.subtitle | escape }}</p>{% endif %}
</header>
{% if page.toc != false %}
<details class="page-toc" hidden>
  <summary>On this page</summary>
  <ul></ul>
</details>
{% endif %}
{{ content }}
