title: DubUrl
description: Database connection URLs and schema tools for .NET.
lang: en
url: "https://seddryck.github.io"
baseurl: "/DubUrl"
theme: just-the-docs
color_scheme: duburl
logo: "/uploads/DubUrl-icon-64.png"
favicon_ico: "/uploads/favicon.ico"
permalink: /:title/

search_enabled: true
search:
  heading_level: 3
  previews: 2
  rel_url: true
  focus_shortcut_key: k
heading_anchors: true
enable_copy_code_button: true
nav_sort: order
aux_links:
  GitHub:
    - https://github.com/Seddryck/DubUrl
back_to_top: true
back_to_top_text: Back to top
footer_content: 'DubUrl · Database tools for .NET · <a href="https://github.com/Seddryck/DubUrl/blob/main/LICENSE">Apache 2.0</a>'

collections:
  docs:
    output: true
    permalink: /docs/:name/
just_the_docs:
  collections:
    docs:
      name: Documentation
      nav_exclude: false

defaults:
  - scope:
      path: ""
    values:
      layout: page
      nav_exclude: true
  - scope:
      path: ""
      type: docs
    values:
      layout: doc
      nav_exclude: false

callouts:
  note:
    title: Note
    color: blue
  warning:
    title: Before you connect
    color: yellow

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
sass:
  style: compressed
  quiet_deps: true
exclude:
  - schema-docs.lock.json
  - Gemfile
  - Gemfile.lock
  - README.md
  - assets/css/main.scss
  - assets/js/main.js
  - assets/js/custom.js
  - blog
  - search.json
