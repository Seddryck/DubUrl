# Automatic analysis must classify colocated provider fixtures as test code.
# Test files remain analyzed; no production or duplication exclusions are added.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*.Testing*/**/*.cs,**/*.QA/**/*.cs,DubUrl.QA/**/*.cs,DubUrl.ProviderTesting/**/*.cs,providers/**/Tests/**/*.cs
