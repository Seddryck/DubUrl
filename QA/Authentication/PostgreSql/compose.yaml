services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_HOST_AUTH_METHOD: reject
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - "${DUBURL_AUTH_FIXTURE_DIR:?Run create-fixture.sh first}:/fixture:ro"
      - "./initialize.sh:/docker-entrypoint-initdb.d/authentication.sh:ro"
    command: ["postgres", "-c", "ssl=on", "-c", "ssl_cert_file=/var/lib/postgresql/server.crt", "-c", "ssl_key_file=/var/lib/postgresql/server.key", "-c", "ssl_ca_file=/fixture/ca.crt"]
