name: Power BI Desktop provider QA
on:
  workflow_dispatch:
concurrency:
  group: qa-powerbidesktop-${{ github.ref }}
  cancel-in-progress: false
permissions: { contents: read }
env: { DOTNET_CLI_TELEMETRY_OPTOUT: 1, DOTNET_NOLOGO: 1, DOTNET_NO_WORKLOAD_UPDATE_NOTIFICATION: 1 }
jobs:
  provider-qa:
    name: Power BI Desktop QA (${{ matrix.framework }})
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { framework: net8.0, sdk: 8.0.416 }
          - { framework: net9.0, sdk: 9.0.308 }
          - { framework: net10.0, sdk: 10.0.401 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with: { dotnet-version: '${{ matrix.sdk }}' }
      - name: Run provider QA
        shell: pwsh
        run: ./DubUrl.QA/PowerBiDesktop/deploy-powerbidesktop-test-env.ps1 -force -config Release -frameworks @('${{ matrix.framework }}')
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with: { name: 'qa-powerbidesktop-results-${{ matrix.framework }}-${{ github.sha }}', path: '.test-results/powerbidesktop/${{ matrix.framework }}', if-no-files-found: error }
      - name: Upload QA bundle
        uses: actions/upload-artifact@v7
        with: { name: 'qa-powerbidesktop-bundle-${{ matrix.framework }}-${{ github.sha }}', path: 'DubUrl.Providers.PowerBiDesktop.QA/bin/qa/powerbidesktop/*/${{ matrix.framework }}/**', include-hidden-files: true, if-no-files-found: error }
