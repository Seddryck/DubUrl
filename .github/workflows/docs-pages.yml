name: Documentation website
on:
  push:
    branches: [main]
    paths: ['docs/**', 'build/*schema_doc*.py', 'build/test_connection_url_builder.mjs', '.github/workflows/docs-pages.yml']
  pull_request:
    paths: ['docs/**', 'build/*schema_doc*.py', 'build/test_connection_url_builder.mjs', '.github/workflows/docs-pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Test bundle import
        run: python -m unittest discover -s build -p test_schema_docs.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test connection URL builder
        run: node --test build/test_connection_url_builder.mjs
      - name: Validate connection capability catalog
        working-directory: docs/schemas/connection-url-builder/v2
        run: |
          python -m pip install --only-binary=:all: jsonschema==4.26.0
          python - <<'PY'
          import json
          from pathlib import Path

          from jsonschema import Draft202012Validator, FormatChecker

          schema = json.loads(Path("schema.json").read_text(encoding="utf-8"))
          catalog = json.loads(Path("catalog.json").read_text(encoding="utf-8"))
          Draft202012Validator.check_schema(schema)
          Draft202012Validator(schema, format_checker=FormatChecker()).validate(catalog)
          PY
      - name: Assemble latest Schema release documentation
        run: python build/import_schema_docs.py
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: artifacts/docs-site
      - name: Build Jekyll
        working-directory: artifacts/docs-site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --strict_front_matter
      - name: Check imported Schema URLs and links
        run: python build/check_schema_doc_links.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/docs-site/_site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
