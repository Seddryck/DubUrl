name: SingleStore provider QA
on:
  workflow_dispatch:
concurrency:
  group: qa-singlestore-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  DOTNET_NO_WORKLOAD_UPDATE_NOTIFICATION: 1
  SINGLESTORE_LICENSE: ${{ secrets.SINGLESTORE_LICENSE }}
jobs:
  provider-qa:
    name: SingleStore QA
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.416
            9.0.308
            10.0.401
      - name: Require SingleStore license
        shell: pwsh
        run: if ([string]::IsNullOrWhiteSpace($env:SINGLESTORE_LICENSE)) { throw 'SINGLESTORE_LICENSE repository secret is required.' }
      - name: Run provider QA
        shell: pwsh
        run: ./DubUrl.QA/SingleStore/deploy-singlestore-test-env.ps1 -force -config Release -frameworks @('net8.0', 'net9.0', 'net10.0')
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with: { name: 'qa-singlestore-results-${{ github.sha }}', path: '.test-results/singlestore', if-no-files-found: error }
      - name: Upload QA bundle
        if: always()
        uses: actions/upload-artifact@v7
        with: { name: 'qa-singlestore-bundle-${{ github.sha }}', path: 'Providers/MySql/DubUrl.Provider.SingleStore.QA/bin/qa/singlestore/*/**', include-hidden-files: true, if-no-files-found: error }
