name: Timescale provider QA

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: qa-timescale-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  DOTNET_NO_WORKLOAD_UPDATE_NOTIFICATION: 1

jobs:
  provider-qa:
    name: Timescale QA
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.416
            9.0.308
            10.0.401
      - name: Run provider QA
        shell: pwsh
        run: >-
          ./QA/DubUrl.QA/Timescale/deploy-timescale-test-env.ps1
          -force
          -config Release
          -frameworks @('net8.0', 'net9.0', 'net10.0')
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qa-timescale-results-${{ github.sha }}
          path: .test-results/timescale
          if-no-files-found: error
      - name: Upload QA bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qa-timescale-bundle-${{ github.sha }}
          path: Providers/PostgreSql/DubUrl.Provider.Timescale.QA/bin/qa/timescale/*/**
          include-hidden-files: true
          if-no-files-found: error
