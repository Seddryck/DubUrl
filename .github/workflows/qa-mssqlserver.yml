name: Microsoft SQL Server provider QA
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:
concurrency:
  group: qa-mssqlserver-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  DOTNET_NO_WORKLOAD_UPDATE_NOTIFICATION: 1
jobs:
  provider-qa:
    name: SQL Server QA (${{ matrix.framework }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { framework: net8.0, sdk: 8.0.416 }
          - { framework: net9.0, sdk: 9.0.308 }
          - { framework: net10.0, sdk: 10.0.401 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with: { dotnet-version: '${{ matrix.sdk }}' }
      - name: Install SQL Server ODBC driver
        shell: bash
        run: |
          curl --proto '=https' --proto-redir '=https' -sSLO https://packages.microsoft.com/config/ubuntu/24.04/packages-microsoft-prod.deb
          sudo dpkg -i packages-microsoft-prod.deb
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18
      - name: Run provider QA
        shell: pwsh
        run: ./DubUrl.QA/MsSqlServer/deploy-mssqlserver-test-env.ps1 -force -config Release -frameworks @('${{ matrix.framework }}')
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with: { name: 'qa-mssqlserver-results-${{ matrix.framework }}-${{ github.sha }}', path: '.test-results/mssqlserver/${{ matrix.framework }}', if-no-files-found: error }
      - name: Upload QA bundle
        uses: actions/upload-artifact@v7
        with: { name: 'qa-mssqlserver-bundle-${{ matrix.framework }}-${{ github.sha }}', path: 'DubUrl.Providers.MsSqlServer.QA/bin/qa/mssqlserver/*/${{ matrix.framework }}/**', include-hidden-files: true, if-no-files-found: error }
