name: sqlserver OLE DB QA

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: qa-sqlserver-oledb-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  DOTNET_NO_WORKLOAD_UPDATE_NOTIFICATION: 1

jobs:
  provider-qa:
    name: sqlserver OLE DB QA (${{ matrix.framework }})
    runs-on: windows-2025
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - framework: net8.0
            sdk: 8.0.416
          - framework: net9.0
            sdk: 9.0.308
          - framework: net10.0
            sdk: 10.0.401
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ matrix.sdk }}
      - name: Run Windows OLE DB QA
        shell: pwsh
        run: ./QA/DubUrl.QA/MsSqlServer/deploy-sqlserver-oledb-test-env.ps1 -installPrerequisites -config Release -frameworks @('${{ matrix.framework }}')
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qa-sqlserver-oledb-results-${{ matrix.framework }}-${{ github.sha }}
          path: .test-results/sqlserver-oledb/${{ matrix.framework }}
          include-hidden-files: true
          if-no-files-found: error
      - name: Upload QA bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qa-sqlserver-oledb-bundle-${{ matrix.framework }}-${{ github.sha }}
          path: Providers/SqlServer/DubUrl.Provider.MsSqlServer.QA/bin/qa/mssqlserver/*/${{ matrix.framework }}/**
          include-hidden-files: true
          if-no-files-found: error
