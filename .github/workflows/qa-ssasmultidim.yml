name: SSAS Multidimensional provider QA
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:
concurrency:
  group: qa-ssasmultidim-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions: { contents: read }
env: { DOTNET_CLI_TELEMETRY_OPTOUT: 1, DOTNET_NOLOGO: 1, DOTNET_NO_WORKLOAD_UPDATE_NOTIFICATION: 1 }
jobs:
  provider-qa:
    name: SSAS Multidimensional QA
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          repository: Seddryck/DubUrl.Providers
          ref: 20d5f745f3b89b6026557c3c794fcb67962a6497
          persist-credentials: false
      - name: Check out Core candidate
        uses: actions/checkout@v7
        with:
          path: .qa-core
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.416
            9.0.308
            10.0.401
      - name: Prepare QA packages against Core candidate
        uses: ./.qa-core/.github/actions/prepare-provider-qa
        with:
          core-version: '0.70.2'
      - name: Install SSAS and restore AdventureWorks
        uses: ./.github/actions/setup-ssas-qa
        with:
          mode: multidim
      - name: Run provider QA
        shell: pwsh
        run: ./QA/DubUrl.QA/SsasMultidim/deploy-ssasmultidim-test-env.ps1 -config Release -frameworks @('net8.0', 'net9.0', 'net10.0')
      - name: Verify formatted MDX cells through DubUrl.Adomd
        shell: pwsh
        env:
          DUBURL_ADOMD_TEST_CONNECTION: 'Data Source=localhost\multidim;Initial Catalog=AdventureWorks;Locale Identifier=1033'
        run: |
          dotnet test .qa-core/DubUrl.Adomd.Testing/DubUrl.Adomd.Testing.csproj -c Release -f net10.0 --filter FullyQualifiedName~ExecuteCellSet_AdventureWorks --logger "trx;LogFileName=adomd-cellset.trx" --results-directory .test-results/ssasmultidim
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          [xml] $results = Get-Content .test-results/ssasmultidim/adomd-cellset.trx -Raw
          if ([int] $results.TestRun.ResultSummary.Counters.passed -ne 1) {
            throw 'The ADOMD cellset test did not pass.'
          }
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with: { name: 'qa-ssasmultidim-results-${{ github.sha }}', path: '.test-results/ssasmultidim', if-no-files-found: error }
      - name: Upload QA bundle
        if: always()
        uses: actions/upload-artifact@v7
        with: { name: 'qa-ssasmultidim-bundle-${{ github.sha }}', path: 'Providers/Adomd/DubUrl.Provider.SsasMultidim.QA/bin/qa/ssasmultidim/*/**', include-hidden-files: true, if-no-files-found: error }
