name: SSAS Multidimensional provider QA
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:
concurrency:
  group: qa-ssasmultidim-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions: { contents: read }
env: { DOTNET_CLI_TELEMETRY_OPTOUT: 1, DOTNET_NOLOGO: 1, DOTNET_NO_WORKLOAD_UPDATE_NOTIFICATION: 1 }
jobs:
  provider-qa:
    name: SSAS Multidimensional QA
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.416
            9.0.308
            10.0.401
      - name: Run provider QA
        shell: pwsh
        run: ./DubUrl.QA/SsasMultidim/deploy-ssasmultidim-test-env.ps1 -config Release -frameworks @('net8.0', 'net9.0', 'net10.0')
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with: { name: 'qa-ssasmultidim-results-${{ github.sha }}', path: '.test-results/ssasmultidim', if-no-files-found: error }
      - name: Upload QA bundle
        if: always()
        uses: actions/upload-artifact@v7
        with: { name: 'qa-ssasmultidim-bundle-${{ github.sha }}', path: 'DubUrl.Providers.SsasMultidim.QA/bin/qa/ssasmultidim/*/**', include-hidden-files: true, if-no-files-found: error }
