services:
  postgresql:
    image: ${POSTGRES_IMAGE:-postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3}
    environment:
      POSTGRES_PASSWORD: Password12!
      POSTGRES_DB: DubUrl
    ports:
      - "5432:5432"
    volumes:
      - ./initialize.sql:/docker-entrypoint-initdb.d/initialize.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d DubUrl" ]
      interval: 2s
      timeout: 5s
      retries: 20
