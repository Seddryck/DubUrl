services:
  postgresql:
    image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
    environment: { POSTGRES_PASSWORD: 'Password12!', POSTGRES_DB: DubUrl }
    volumes: [ './initialize.sql:/docker-entrypoint-initdb.d/initialize.sql:ro' ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d DubUrl" ]
      interval: 3s
      timeout: 5s
      retries: 30
  trino:
    image: trinodb/trino:477@sha256:ada485e4bffb90f859b401dc04c393d147b5840846ef66b27110662eb2675854
    depends_on:
      postgresql: { condition: service_healthy }
    ports: [ '8080:8080' ]
    volumes: [ './pg.properties:/etc/trino/catalog/pg.properties:ro' ]
