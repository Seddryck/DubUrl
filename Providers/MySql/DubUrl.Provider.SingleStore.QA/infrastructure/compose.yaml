services:
  singlestore:
    image: ghcr.io/singlestore-labs/singlestoredb-dev@sha256:7ef945c3bf93e6b50b17cd8f5fbfa6f304f55ef04f45ccf408bbf051430a9457
    platform: linux/amd64
    cpus: 2
    mem_limit: 4g
    environment:
      ROOT_PASSWORD: ${ROOT_PASSWORD:?Run the SingleStore QA deployment script}
      ENABLE_STUDIO: "0"
    ports:
      - "127.0.0.1:${DUBURL_SINGLESTORE_QA_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$ROOT_PASSWORD\" singlestore -h 127.0.0.1 -u root -N -e 'select 1' | grep -qx '1'"]
      interval: 5s
      timeout: 10s
      retries: 60
