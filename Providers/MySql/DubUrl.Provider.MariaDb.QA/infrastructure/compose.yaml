services:
  mariadb:
    image: mariadb@sha256:d9fc02976678d4236145299c40dc267051681b33489c994f0ec4a097ce4a9521
    platform: linux/amd64
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Run the MariaDB QA deployment script}
    ports:
      - "127.0.0.1:${DUBURL_MARIADB_QA_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MARIADB_ROOT_PASSWORD\" mariadb -h 127.0.0.1 -u root -N -e 'select 1' | grep -qx '1'"]
      interval: 3s
      timeout: 10s
      retries: 60
